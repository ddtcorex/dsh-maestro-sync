name: Bug Report
description: Report a reproducible bug in dsh-maestro-sync.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please search existing issues to avoid duplicates.
        For security vulnerabilities, use private reporting: https://github.com/ddtcorex/dsh-maestro-sync/security/advisories

  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `npm view @ddtcorex/dsh-maestro-sync version` or version in package.json
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - Sync service (preview / apply / plan)
        - Transport / staging (ssh / rsync / remote CAS helper)
        - Session Zstd handling (session-plan / session-merge)
        - CLI (lib/cli.js) or sync-harness.sh wrapper
        - Settings UI (client)
        - Validation / eligible-data rules
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js, pnpm, DSH versions
      render: bash

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact preview/apply flow or CLI invocation used.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste structured SyncFailure / journal output when available.
    validations:
      required: true