- insert:
    - id: dsh-maestro-sync
      name: '@ddtcorex/dsh-maestro-sync'
      channel: /dsh-maestro-sync
      # rpc.handle registers a webServer route inside an effect fiber
      # which carries only the row's inject (not the module's);
      # without webServer the row fails on harnesses that provide webServer after rows apply (DSH 0.1.5-rc.1+).
      inject: ['tools', 'connection', 'webServer']
